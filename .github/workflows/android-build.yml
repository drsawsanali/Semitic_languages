name: Build Signed APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew 2>/dev/null || true

      - name: Create .env for API Keys
        run: |
          touch .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" >> .env
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then echo 'GEMINI_API_KEY="mock_key"' >> .env; fi
          if [ -z "${{ secrets.MAPS_API_KEY }}" ]; then echo 'MAPS_API_KEY="mock_key"' >> .env; fi

      - name: Prepare Signing Keys and Config
        run: |
          if [ -f "my-upload-key.jks.b64" ]; then base64 -d my-upload-key.jks.b64 > my-upload-key.jks 2>/dev/null || true; fi
          if [ -f "key.jks.b64" ]; then base64 -d key.jks.b64 > key.jks 2>/dev/null || true; fi
          cp key.jks my-upload-key.jks 2>/dev/null || true
          mkdir -p app && cp key.jks app/my-upload-key.jks 2>/dev/null || true
          
          # قراءة الاسم المستعار (Alias) الحقيقي من الملف تلقائياً
          REAL_ALIAS=$(keytool -list -v -keystore my-upload-key.jks -storepass 1fEdIH8oX1cXWN9rOKc2 | grep -i "Alias name:" | cut -d':' -f2 | xargs | head -n 1)
          echo "Discovered actual Alias: $REAL_ALIAS"
          
          cat << PROP > key.properties
          storePassword=1fEdIH8oX1cXWN9rOKc2
          keyPassword=1fEdIH8oX1cXWN9rOKc2
          keyAlias=$REAL_ALIAS
          storeFile=../my-upload-key.jks
          PROP
          cp key.properties app/key.properties 2>/dev/null || true
          
          # حفظ الاسم المستعار للخطوة التالية
          echo "REAL_ALIAS=$REAL_ALIAS" >> $GITHUB_ENV

      - name: Build Signed APK
        run: |
          ./gradlew clean assembleRelease --no-daemon --no-configuration-cache \
            -Pandroid.injected.signing.store.file=$(pwd)/my-upload-key.jks \
            -Pandroid.injected.signing.store.password=1fEdIH8oX1cXWN9rOKc2 \
            -Pandroid.injected.signing.key.alias="${{ env.REAL_ALIAS }}" \
            -Pandroid.injected.signing.key.password=1fEdIH8oX1cXWN9rOKc2 \
            -PstorePassword=1fEdIH8oX1cXWN9rOKc2 \
            -PkeyPassword=1fEdIH8oX1cXWN9rOKc2 \
            -PkeyAlias="${{ env.REAL_ALIAS }}"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: '**/build/outputs/apk/release/*.apk'
