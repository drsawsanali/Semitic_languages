name: Build Signed APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew 2>/dev/null || true

      - name: Create .env for API Keys
        run: |
          touch .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" >> .env
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then echo 'GEMINI_API_KEY="mock_key"' >> .env; fi
          if [ -z "${{ secrets.MAPS_API_KEY }}" ]; then echo 'MAPS_API_KEY="mock_key"' >> .env; fi

      - name: Generate Fresh Keystore
        run: |
          rm -f *.jks app/*.jks key.properties app/key.properties
          keytool -genkeypair -v -keystore release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-alias -storepass "release123" -keypass "release123" -dname "CN=SemiticApp,O=Semitic,C=US"

      - name: Build Signed APK
        run: |
          ./gradlew clean assembleRelease --no-daemon --no-configuration-cache \
            -Pandroid.injected.signing.store.file=$(pwd)/release-key.jks \
            -Pandroid.injected.signing.store.password=release123 \
            -Pandroid.injected.signing.key.alias=my-alias \
            -Pandroid.injected.signing.key.password=release123 \
            -PstorePassword=release123 \
            -PkeyPassword=release123 \
            -PkeyAlias=my-alias

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: '**/build/outputs/apk/release/*.apk'
